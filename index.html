}
async function syncPoll(){
  if(!SYNC.on || SYNC.busy || document.hidden) return;
  try{ const head=await sbGet(false); syncMark(true);
    if(head && head.rev!==SYNC.rev && !SYNC.dirty && !SYNC.busy){ const full=await sbGet(true); if(!SYNC.dirty && !SYNC.busy) applyRemote(full.data, full.rev); }
  }catch(e){ syncMark(false); }
}
async function syncStart(){
  if(!SYNC.on) return;
  try{ const full=await sbGet(true);
    if(full && full.data && full.data.tasks){ applyRemote(full.data, full.rev); }
    else { SYNC.base={}; SYNC.rev=full?full.rev:0; SYNC.dirty=true; await syncFlush(); }
    syncMark(true);
  }catch(e){ syncMark(false); SYNC.base=shared(S);
    if(e instanceof TypeError){ SYNC.on=false; SYNC.blocked=true; render(); return setTimeout(()=>toast('Esta página no puede conectarse a Supabase: los cambios quedan solo en este dispositivo','alert'), 1800); }
  }
  setInterval(syncPoll, 1500); document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncPoll(); });
}

/* ---------------------- llamadas de voz entre dispositivos ---------------------- */
// Audio directo entre los dos teléfonos (WebRTC). Supabase Realtime solo sirve para avisar y conectar las dos partes.
// Ninguno ve el número del otro y la llamada no se graba.
const DEVICE_ID = (()=>{ try{ let d=localStorage.getItem('chambaya-device'); if(!d){ d=Math.random().toString(36).slice(2,10); localStorage.setItem('chambaya-device', d); } return d; }catch(e){ return Math.random().toString(36).slice(2,10); } })();
const ICE = [{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}];
const RT = { ws:null, ref:2, joined:false, q:[], hb:null, tries:0 };
const RT_TOPIC = () => 'realtime:'+SB_ROOM+'-calls';
const rtOK = () => SYNC.on && !SYNC.blocked && typeof WebSocket!=='undefined' && typeof RTCPeerConnection!=='undefined' && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
function rtConnect(){
  if(!(SYNC.on && !SYNC.blocked) || RT.ws || typeof WebSocket==='undefined') return;
  let ws; try{ ws=new WebSocket(SB_URL.replace(/^http/,'ws')+'/realtime/v1/websocket?apikey='+encodeURIComponent(SB_KEY)+'&vsn=1.0.0'); }catch(e){ return; }
  RT.ws=ws; RT.joined=false;
  ws.onopen=()=>{ RT.tries=0; ws.send(JSON.stringify({topic:RT_TOPIC(), event:'phx_join', payload:{config:{broadcast:{self:false, ack:false}, presence:{key:''}, private:false}}, ref:'1', join_ref:'1'}));
    clearInterval(RT.hb); RT.hb=setInterval(()=>{ try{ ws.send(JSON.stringify({topic:'phoenix', event:'heartbeat', payload:{}, ref:String(RT.ref++)})); }catch(e){} }, 25000); };
  ws.onmessage=ev=>{ let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.topic===RT_TOPIC() && m.event==='phx_reply' && m.ref==='1'){ RT.joined = m.payload && m.payload.status==='ok'; if(RT.joined) RT.q.splice(0).forEach(rtSend); }
    if(m.topic===RT_TOPIC() && m.event==='broadcast' && m.payload && m.payload.event==='sig') onSignal(m.payload.payload); };
  ws.onclose=()=>{ RT.ws=null; RT.joined=false; clearInterval(RT.hb); setTimeout(rtConnect, Math.min(15000, 1000*(++RT.tries))); };
  ws.onerror=()=>{ try{ ws.close(); }catch(e){} };
}
function rtSend(msg){ msg={...msg, dev:DEVICE_ID};
  if(!RT.ws || !RT.joined || RT.ws.readyState!==1){ RT.q.push(msg); rtConnect(); return; }
  RT.ws.send(JSON.stringify({topic:RT_TOPIC(), event:'broadcast', payload:{type:'broadcast', event:'sig', payload:msg}, ref:String(RT.ref++), join_ref:'1'})); }
const mySession = () => UI.app==='cliente' ? S.sessions.cliente : UI.app==='pro' ? S.sessions.pro : null;
function callModal(c, status){
  const who = c.role==='caller' ? c.to : c.by, t=T(c.task);
  const ringing = c.role==='callee' && !c.accepted;
  modal(`<div class="call-ui">${av(who,76)}<h2>${esc(dn(who))}</h2><p class="muted sm">${t&&who===t.pro?'Profesional':'Cliente'} · ${esc(c.task)}</p>
    <p id="call-st" class="call-st ${c.conn?'on':''}">${status}</p>
    <div class="call-note">${ic('lock',14)} <span>Llamada dentro de ChambaYa: ninguno ve el número del otro. <b>No se graba.</b> Los acuerdos importantes dejalos por escrito en el chat.</span></div>
    ${ringing?`<div class="row" style="gap:10px;justify-content:center"><button class="btn call-hang" data-act="call-reject">${ic('x',17)} Rechazar</button><button class="btn pri call-ok" data-act="call-answer">${ic('phone',17)} Contestar</button></div>`
      :`<div class="row" style="gap:10px;justify-content:center"><button class="btn" id="call-mute" data-act="call-mute">${ic(c.muted?'micoff':'mic',17)} ${c.muted?'Activar micrófono':'Silenciar'}</button><button class="btn call-hang" data-act="call-end">${ic('phone',17)} Colgar</button></div>`}
    </div>`);
}
function callStatus(txt, on){ const e=$('#call-st'); if(e){ e.innerHTML=txt; e.classList.toggle('on',!!on); } }
async function getMic(){ return navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}, video:false}); }
function callAudio(){ let a=document.getElementById('call-audio'); if(!a){ a=document.createElement('audio'); a.id='call-audio'; a.autoplay=true; a.setAttribute('playsinline',''); document.body.appendChild(a); } return a; }
function ringTone(on){ const c=UI.callSt; if(!c) return; clearInterval(c.toneT); if(!on) return; const beep=()=>{ try{ const ctx=c.actx||(c.actx=new (window.AudioContext||window.webkitAudioContext)()); const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=c.role==='callee'?740:440; g.gain.value=.06; o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime+.35); }catch(e){} if(navigator.vibrate && c.role==='callee') navigator.vibrate(300); }; beep(); c.toneT=setInterval(beep, c.role==='callee'?1500:3000); }
function newPC(c){
  const pc = new RTCPeerConnection({iceServers:ICE}); c.pc=pc; c.cands=[];
  c.stream.getTracks().forEach(tr=>pc.addTrack(tr, c.stream));
  pc.onicecandidate = e => { if(e.candidate) rtSend({t:'ice', call:c.id, cand:e.candidate.toJSON ? e.candidate.toJSON() : e.candidate}); };
  pc.ontrack = e => { const a=callAudio(); a.srcObject=e.streams[0]; const pl=a.play(); if(pl&&pl.catch) pl.catch(()=>{}); };
  pc.onconnectionstatechange = () => { const st=pc.connectionState;
    if(st==='connected' && !c.conn){ c.conn=Date.now(); ringTone(false); clearInterval(UI.callT2); const tick=()=>{ if(UI.callSt!==c) return clearInterval(UI.callT2); const s=Math.round((Date.now()-c.conn)/1000); callStatus(`${ic('play',13)} En llamada · ${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`, true); }; tick(); UI.callT2=setInterval(tick,1000); }
    if(st==='failed'){ callStatus(`${ic('alert',13)} No se pudo conectar el audio`); setTimeout(()=>{ if(UI.callSt===c) callHang(true); }, 2500); }
  };
  return pc;
}
async function addCands(c){ if(!c.pc || !c.pc.remoteDescription) return; for(const x of c.cands.splice(0)){ try{ await c.pc.addIceCandidate(x); }catch(e){} } }
async function callStart(t, me, other){
  const c = UI.callSt = {id:Math.random().toString(36).slice(2,10), task:t.id, by:me, to:other, at:now(), conn:null, role:'caller'};
  callModal(c, 'Llamando…');
  try{ c.stream = await getMic(); }catch(e){ UI.callSt=null; closeModal(); return toast('Para llamar, permití el uso del micrófono','alert'); }
  if(UI.callSt!==c){ c.stream.getTracks().forEach(tr=>tr.stop()); return; }
  ringTone(true); rtConnect();
  const ring = () => { if(UI.callSt!==c || c.accepted) return; rtSend({t:'ring', call:c.id, from:me, to:other, task:t.id}); };
  ring(); c.ringT=setInterval(ring, 2000);
  c.noAns=setTimeout(()=>{ if(UI.callSt===c && !c.accepted){ callStatus(`${ic('phone',13)} No contestó`); setTimeout(()=>{ if(UI.callSt===c) callHang(true); }, 1500); } }, 35000);
}
async function callAnswer(){
  const c=UI.callSt; if(!c || c.role!=='callee' || c.accepted) return; ringTone(false);
  try{ c.stream = await getMic(); }catch(e){ toast('Para contestar, permití el uso del micrófono','alert'); return callReject(); }
  c.accepted=true; callModal(c, 'Conectando…'); newPC(c);
  rtSend({t:'accept', call:c.id, toDev:c.peerDev});
}
function callReject(){ const c=UI.callSt; if(!c) return; rtSend({t:'reject', call:c.id, toDev:c.peerDev}); callCleanup(c); toast('Llamada rechazada','phone'); }
function callCleanup(c){
  clearInterval(c.ringT); clearTimeout(c.noAns); clearTimeout(c.lostT); ringTone(false); clearInterval(UI.callT2);
  try{ c.pc && c.pc.close(); }catch(e){} try{ c.stream && c.stream.getTracks().forEach(tr=>tr.stop()); }catch(e){} try{ c.actx && c.actx.close(); }catch(e){}
  const a=document.getElementById('call-audio'); if(a){ a.srcObject=null; }
  if(UI.callSt===c){ UI.callSt=null; closeModal(); }
}
// quien llamó deja el registro en el chat (lo ven los dos)
function callLog(c){ if(c.role!=='caller' || c.logged) return; c.logged=true; const dur=c.conn?Math.max(1,Math.round((Date.now()-c.conn)/1000)):0;
  S.chats.push({task:c.task, from:'sys', kind:'call', icon:'phone', call:{by:c.by, to:c.to, dur, ans:!!c.conn}, at:c.at}); save(); render(); }
function callHang(send){ const c=UI.callSt; if(!c) return; if(send) rtSend({t:'hangup', call:c.id, toDev:c.peerDev}); const dur=c.conn?Math.max(1,Math.round((Date.now()-c.conn)/1000)):0; callLog(c); callCleanup(c); toast(c.conn?`Llamada terminada · ${fmtSec(dur)}`:'Llamada cancelada','phone'); }
async function onSignal(m){
  if(!m || m.dev===DEVICE_ID) return;
  const c = UI.callSt;
  if(m.toDev && m.toDev!==DEVICE_ID) return; // dirigido a otro dispositivo
  if(m.t==='ring'){
    if(m.to!==mySession()) return;
    if(c && c.id===m.call){ clearTimeout(c.lostT); c.lostT=setTimeout(()=>{ if(UI.callSt===c && !c.accepted){ callCleanup(c); toast(`Llamada perdida de ${first(dn(m.from))}`,'phone'); } }, 6000); return; }
    if(c){ rtSend({t:'busy', call:m.call, toDev:m.dev}); return; }
    const n = UI.callSt = {id:m.call, task:m.task, by:m.from, to:m.to, at:now(), conn:null, role:'callee', peerDev:m.dev};
    callModal(n, `${ic('phone',13)} Te está llamando…`); ringTone(true);
    n.lostT=setTimeout(()=>{ if(UI.callSt===n && !n.accepted){ callCleanup(n); toast(`Llamada perdida de ${first(dn(m.from))}`,'phone'); } }, 6000);
    return;
  }
  if(!c || c.id!==m.call) return;
  if(c.peerDev && m.dev!==c.peerDev) return;
  if(m.t==='accept' && c.role==='caller' && !c.accepted){ c.accepted=true; c.peerDev=m.dev; clearInterval(c.ringT); clearTimeout(c.noAns); ringTone(false); callStatus('Conectando…');
    const pc=newPC(c); const off=await pc.createOffer({offerToReceiveAudio:true}); await pc.setLocalDescription(off); rtSend({t:'offer', call:c.id, toDev:c.peerDev, sdp:pc.localDescription.toJSON?pc.localDescription.toJSON():{type:pc.localDescription.type, sdp:pc.localDescription.sdp}}); return; }
  if(m.t==='offer' && c.role==='callee' && c.pc){ await c.pc.setRemoteDescription(m.sdp); const ans=await c.pc.createAnswer(); await c.pc.setLocalDescription(ans); rtSend({t:'answer', call:c.id, toDev:c.peerDev, sdp:c.pc.localDescription.toJSON?c.pc.localDescription.toJSON():{type:c.pc.localDescription.type, sdp:c.pc.localDescription.sdp}}); addCands(c); return; }
  if(m.t==='answer' && c.role==='caller' && c.pc){ await c.pc.setRemoteDescription(m.sdp); addCands(c); return; }
  if(m.t==='ice'){ c.cands=c.cands||[]; c.cands.push(m.cand); addCands(c); return; }
  if(m.t==='reject' || m.t==='busy'){ clearInterval(c.ringT); callStatus(`${ic('phone',13)} ${m.t==='busy'?'Está en otra llamada':'No puede contestar ahora'}`); setTimeout(()=>{ if(UI.callSt===c) callHang(false); }, 1600); return; }
  if(m.t==='hangup'){ callHang(false); return; }
}
fromHash(); render(); splash(); loadGeo(); syncStart().then(()=>rtConnect());
