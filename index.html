   Layout: Cliente = web de consumo con barra superior · Pro = panel con barra lateral oscura · Consola = herramienta densa con pestañas. */

  color-scheme: light;
  --ink:#13211d; --ink2:#3b4945; --muted:#6a7773; --line:#e2e7e4; --line2:#eef1ef;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:28px;line-height:1.15;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:15.5px;font-weight:700;font-family:var(--f-body);letter-spacing:0}
p{margin:0}
a{color:var(--brand)}
.ic{flex:none;vertical-align:middle}
.num,.money{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sm{font-size:13px} .xs{font-size:12px} .b{font-weight:700} .sb{font-weight:600}
.row{display:flex;align-items:center;gap:10px} .row.top{align-items:flex-start} .wrap{flex-wrap:wrap}
.between{justify-content:space-between} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px} .stack.tight{gap:8px} .stack.loose{gap:22px}
.grid{display:grid;gap:14px} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh)}
.card.flat{box-shadow:none} .card.pad0{padding:0} .card.tight{padding:14px 16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.divider{height:1px;background:var(--line);margin:4px 0}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 15px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--kd-c9d2ce);background:var(--sunk)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 35%,transparent);outline-offset:1px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-ink)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--kd-f0cbc6)}
.btn.danger:hover{background:var(--bad-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn.lg{padding:12px 20px;font-size:15px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink2)}
.icon-btn:hover{background:var(--sunk)}
/* formularios */
label.l{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink2)}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;transition:border-color .15s}
.in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
textarea.in{min-height:92px;resize:vertical}
.field{display:flex;flex-direction:column}
.help{font-size:12.5px;color:var(--muted);margin-top:5px}
.inp-group{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.inp-group span{padding:0 10px;color:var(--muted);font-weight:600;font-size:14px;background:var(--sunk);align-self:stretch;display:grid;place-items:center;border-right:1px solid var(--line)}
.inp-group input{border:0;padding:10px 12px;width:100%;outline:none;background:transparent}
.inp-group:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
/* estados */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap;line-height:1.5}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.pill.nodot:before{display:none}
.p-gray{background:var(--kb-eef1f0);color:var(--kt-4c5955)} .p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)} .p-vio{background:var(--vio-soft);color:var(--vio)} .p-brand{background:var(--brand-soft);color:var(--brand-ink)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:2px 8px;background:var(--sunk);color:var(--ink2)}
.verified{display:inline-flex;align-items:center;gap:4px;color:var(--brand);font-size:12.5px;font-weight:700}
.stars{display:inline-flex;gap:1px;color:var(--accent);vertical-align:-2px}
.stars .off{color:#d9dfdc}
.av{flex:none;display:grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;letter-spacing:.02em}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45}
.notice.info{background:var(--info-soft);color:var(--kt-173a86)}
.ttabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px;margin-bottom:16px;width:max-content;max-width:100%}
.ttabs button{display:flex;align-items:center;gap:7px;border:0;background:transparent;font:inherit;font-weight:700;font-size:14px;color:var(--ink2);padding:9px 16px;border-radius:12px;cursor:pointer;position:relative}
.ttabs button.on{background:var(--brand);color:#fff} .ttabs .count{background:var(--accent);color:var(--kt-3a2600);border-radius:99px;font-size:11px;padding:1px 7px} .ttabs button.on .count{background:var(--kb-ffffff);color:var(--brand)}
.ttabs .dot{width:8px;height:8px;border-radius:50%;background:#e5484d}
.go-card{display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;font:inherit;color:inherit;background:var(--surface)} .go-card>svg:first-child{color:var(--brand)} .go-card span{flex:1;display:flex;flex-direction:column} .go-card small{color:var(--muted);font-size:12.5px;margin-top:2px}
.go-card:hover{box-shadow:0 10px 26px rgba(60,45,20,.11)}
@media (max-width:640px){ .ttabs{width:100%} .ttabs button{flex:1;justify-content:center;padding:9px 6px} }
.offer-m{background:var(--kb-ffffff);border:1px solid var(--line);text-align:left;max-width:320px;align-self:center;padding:12px 14px;border-radius:16px}
.offer-m.live{border-color:var(--accent);box-shadow:0 6px 18px rgba(255,181,71,.18)} .offer-amt{font-family:var(--f-display);font-weight:800;font-size:22px;margin-top:4px} .notice.warn{background:var(--warn-soft);color:var(--kt-6f3d05)}
.notice.ok{background:var(--ok-soft);color:var(--kt-0f4f30)} .notice.bad{background:var(--bad-soft);color:var(--kt-7a221b)} .notice.plain{background:var(--sunk);color:var(--ink2);border:1px solid var(--line)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:44px 20px;border:1px dashed var(--kd-d3dbd7);border-radius:var(--r-lg);background:var(--surface);color:var(--muted)}
.empty .ei{width:48px;height:48px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
/* tablas */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--kb-f6faf8)}
.tbl .r{text-align:right}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
/* factura */
.inv{font-size:14px}
.inv .ln{display:flex;justify-content:space-between;gap:16px;padding:7px 0}
.inv .ln .d{color:var(--ink2)} .inv .ln .d small{display:block;color:var(--muted);font-size:12.5px}
.inv .ln.sub{border-top:1px dashed var(--line);margin-top:4px;padding-top:10px}
.inv .ln.tot{border-top:2px solid var(--ink);margin-top:6px;padding-top:12px;font-weight:700;font-size:16px}
.inv .ln.neg .v{color:var(--bad)}
.inv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.receipt{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--info);font-weight:600}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(10,20,17,.48);display:grid;place-items:center;padding:20px;z-index:80;animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:500px;max-height:92vh;overflow:auto;box-shadow:var(--sh-lg);padding:24px}
.modal.wide{max-width:760px}
.modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;box-shadow:var(--sh-lg);display:flex;gap:8px;align-items:center;animation:up .2s}
@keyframes fade{from{opacity:0}} @keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* demo switcher */
.demo{position:fixed;right:16px;bottom:16px;z-index:70;display:flex;align-items:center;gap:4px;background:rgba(19,33,29,.92);backdrop-filter:blur(6px);color:#fff;border-radius:99px;padding:5px;box-shadow:var(--sh-lg);font-size:12.5px}
.demo span{padding:0 8px 0 10px;opacity:.65;font-weight:600}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#e0a030;margin:0 8px 0 4px;box-shadow:0 0 0 3px rgba(224,160,48,.25)} .sync-dot.off{background:#9aa6a1;box-shadow:none} .sync-dot.ok{background:#3ed28a;box-shadow:0 0 0 3px rgba(62,210,138,.25)}
.demo a{color:#fff;text-decoration:none;padding:6px 11px;border-radius:99px;font-weight:600}
.demo a.on{background:var(--kb-ffffff);color:var(--ink)}
.demo a:hover:not(.on){background:rgba(255,255,255,.12)}

/* ====================== LANZADOR ====================== */
.launch{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 20px 90px;background:radial-gradient(1200px 500px at 50% -10%, var(--kb-dcefe8), transparent),var(--bg)}
.launch .brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.03em}
.logo-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--brand);color:#fff}
.launch h1{font-size:38px;text-align:center;max-width:720px;margin:28px 0 10px}
.launch .lead{color:var(--muted);text-align:center;max-width:620px;font-size:16.5px}
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;max-width:1040px;width:100%;margin-top:40px}
.app-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--sh);text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.app-card:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(16,33,29,.12)}
.app-card .ai{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:#fff}
.app-card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14px;color:var(--ink2)}
.app-card li{display:flex;gap:8px;align-items:flex-start}
.app-card li .ic{color:var(--brand);margin-top:3px}
.app-card .go{margin-top:auto;display:flex;align-items:center;gap:6px;font-weight:700;color:var(--brand)}

/* ====================== LOGIN COMÚN ====================== */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth-art{padding:48px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;position:relative;overflow:hidden}
.auth-art h2{font-size:36px;line-height:1.1;max-width:440px;color:#fff}
.auth-art .q{font-size:16px;opacity:.85;max-width:420px;margin-top:14px}
.auth-art .deco{position:absolute;right:-80px;bottom:-80px;width:360px;height:360px;border-radius:50%;border:56px solid rgba(255,255,255,.07)}
.auth-art .deco2{position:absolute;right:120px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.06)}
.auth-form{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--surface)}
.auth-form .box{width:100%;max-width:400px}
.acct{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.acct:hover{border-color:var(--brand);background:var(--kb-f8fbfa)}

/* ====================== APP CLIENTE ====================== */
.c-top{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--surface) 94%, transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.c-top .in-w{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:12px 24px}
.c-logo{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.03em;color:var(--ink);text-decoration:none;cursor:pointer;border:0;background:none;padding:0}
.c-logo .logo-mark{width:32px;height:32px;border-radius:9px}
.c-nav{display:flex;gap:4px}
.c-nav button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:600;color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:7px}
.c-nav button:hover{background:var(--line2)} .c-nav button.on{color:var(--brand);background:var(--brand-soft)}
.c-nav .count{background:var(--brand);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:700}
.c-main{max-width:1160px;margin:0 auto;padding:30px 24px 110px}
.loc{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);font-weight:600;background:var(--sunk);border:1px solid var(--line);padding:6px 11px;border-radius:99px}
.hero{background:linear-gradient(135deg,var(--brand) 0%,#0e7a62 100%);border-radius:24px;padding:38px 40px;color:#fff;position:relative;overflow:hidden}
.hero h1{font-size:36px;color:#fff;max-width:560px}
.hero p{opacity:.85;margin-top:8px;font-size:16px}
.hero .search{margin-top:22px;display:flex;align-items:center;gap:10px;background:var(--kb-ffffff);border-radius:14px;padding:6px 6px 6px 16px;max-width:560px;color:var(--ink)}
.hero .search input{border:0;outline:none;flex:1;padding:8px 0;font-size:15.5px;background:transparent}
.hero .ring{position:absolute;right:-60px;top:-60px;width:300px;height:300px;border-radius:50%;border:44px solid rgba(255,255,255,.08)}
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.cat{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;transition:border-color .15s,transform .15s,box-shadow .15s}
.cat:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--sh)}
.cat .ci{width:40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.cat .cn{font-weight:700;font-size:14.5px}
.cat .cp{font-size:12.5px;color:var(--muted)}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.trust .t{display:flex;gap:12px;align-items:flex-start;padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.trust .ti{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--kt-8a5a00);display:grid;place-items:center;flex:none}
.steps{display:flex;gap:6px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.steps .s{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted)}
.steps .s i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--kd-cdd6d2);font-size:12.5px}
.steps .s.on{color:var(--ink)} .steps .s.on i{background:var(--brand);border-color:var(--brand);color:#fff}
.steps .s.done{color:var(--brand)} .steps .s.done i{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand)}
.steps .bar{width:34px;height:1.5px;background:var(--kb-d5ddd9)}
.book{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.sum{position:sticky;top:84px}
.pro-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);transition:border-color .15s,box-shadow .15s}
.pro-card:hover{border-color:var(--kd-bfd3cb);box-shadow:var(--sh)}
.pro-card .price{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.pro-card .quote{font-size:13.5px;color:var(--ink2);background:var(--sunk);border-radius:10px;padding:9px 12px;margin-top:10px;border-left:3px solid var(--accent)}
.task-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;transition:border-color .15s}
.task-row:hover{border-color:var(--kd-bfd3cb)}
.task-row .ti{width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.tracker{display:flex;gap:0;margin:4px 0 2px}
.tracker .st{flex:1;display:flex;flex-direction:column;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);position:relative}
.tracker .st .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--kd-d1dad6);background:var(--surface);display:grid;place-items:center;z-index:1;color:#fff}
.tracker .st:not(:last-child):after{content:"";position:absolute;left:22px;right:0;top:10px;height:2px;background:var(--kb-d1dad6)}
.tracker .st.done{color:var(--ink)} .tracker .st.done .dot{background:var(--brand);border-color:var(--brand)}
.tracker .st.done:not(:last-child):after{background:var(--brand)}
.tracker .st.cur{color:var(--ink)} .tracker .st.cur .dot{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.tips{display:flex;gap:8px;flex-wrap:wrap}
.tips button{flex:1;min-width:72px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.tips button small{font-weight:500;color:var(--muted);font-size:12px}
.tips button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}
.rate-in{display:flex;gap:4px}
.rate-in button{border:0;background:none;cursor:pointer;color:#d0d8d4;padding:2px}
.rate-in button.on{color:var(--accent)}
.paycard{border-radius:16px;padding:18px;color:#fff;background:linear-gradient(135deg,#13211d,#0b5d4b);font-variant-numeric:tabular-nums;margin-bottom:16px}
.paycard .pn{font-size:18px;letter-spacing:2.5px;margin:20px 0 10px}
.radio-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface)}
.radio-card.on{border-color:var(--brand);background:var(--kb-f6fbf9)}
.radio-card input{accent-color:var(--brand)}
.brandmark{display:inline-grid;place-items:center;min-width:42px;height:28px;border-radius:6px;background:#1a1f71;color:#fff;font-weight:800;font-size:11px;font-style:italic;letter-spacing:.02em}
.brandmark.mc{background:#231f20}
.chat{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden;box-shadow:0 1px 2px rgba(16,24,20,.04),0 8px 24px rgba(16,24,20,.05)}
.chat .msgs{flex:1;overflow:auto;padding:16px 16px 10px;display:flex;flex-direction:column;gap:4px;min-height:260px;max-height:min(62vh,560px);background:var(--kb-f6f4ef);background-image:radial-gradient(rgba(14,90,72,.045) 1px,transparent 1px);background-size:18px 18px}
.ch-head{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.ch-head b{display:block;font-size:15px;line-height:1.2} .ch-head small{display:block;font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-priv{display:flex;align-items:center;gap:6px;justify-content:center;font-size:11.5px;color:var(--muted);padding:5px 10px;background:var(--sunk);border-bottom:1px solid var(--line)}
.ch-remind{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--kb-fff8e6);border-bottom:1px solid var(--kd-f4dfa8);color:var(--kt-6f3d05);font-size:13px;line-height:1.4} .ch-remind .btn{flex-shrink:0}
.ch-day{display:flex;justify-content:center;margin:10px 0 6px} .ch-day span{font-size:11.5px;font-weight:700;color:var(--ink2);background:color-mix(in srgb, var(--surface) 92%, transparent);border:1px solid var(--line);padding:3px 10px;border-radius:99px;text-transform:capitalize}
.ev{display:flex;gap:8px;align-items:flex-start;align-self:center;max-width:min(88%,520px);margin:5px 0;padding:7px 12px;border-radius:12px;background:color-mix(in srgb, var(--surface) 80%, transparent);border:1px solid var(--line);font-size:12.5px;color:var(--ink2);line-height:1.4;text-align:left}
.ev .ev-i{flex-shrink:0;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--kt-0f6b40);margin-top:-1px}
.ev time{display:inline;margin-left:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.ev.ask{background:var(--kb-fffaf0);border-color:var(--kd-f4dfa8);color:var(--kt-6f3d05);text-align:center;flex-direction:column;align-items:center} .ev.ask .ev-i{background:var(--kb-ffefc9);color:var(--kt-8a5a00)}
.ev.call .ev-i{background:var(--kb-e6edff);color:var(--kt-20376b)} .ev.miss .ev-i{background:var(--kb-fde8e5);color:var(--kt-a1301f)}
.bub-row{display:flex;align-items:flex-end;gap:7px;margin-top:6px;max-width:100%} .bub-row.me{justify-content:flex-end} .bub-row.cont{margin-top:2px;padding-left:35px} .bub-row.me.cont{padding-left:0}
.bub{position:relative;max-width:min(78%,480px);padding:8px 12px 6px;border-radius:16px 16px 16px 5px;background:var(--surface);border:1px solid var(--line);font-size:14.5px;line-height:1.42;box-shadow:0 1px 1px rgba(16,24,20,.04);overflow-wrap:anywhere}
.bub.me{border-radius:16px 16px 5px 16px;background:var(--brand);border-color:var(--brand);color:#fff}
.bub time{display:block;text-align:right;font-size:10.5px;margin-top:2px;opacity:.6}
.bub.blk{align-self:flex-end;background:var(--kb-ffffff);color:var(--ink);border:1px dashed var(--kd-e7b4ad);margin-top:6px} .bub.blk s{color:var(--muted)} .bub.blk .xs{color:var(--bad)}
.bub.rc{padding:5px 5px 4px} .bub.rc time{padding-right:6px}
.rc-card{display:flex;flex-direction:column;gap:0;border:0;padding:0;background:var(--surface);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;width:230px;color:var(--ink)}
.rc-card img{width:100%;height:150px;object-fit:cover;display:block;background:var(--sunk)} .rc-ph{height:96px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.rc-meta{display:flex;flex-direction:column;gap:2px;padding:8px 10px;font-size:12.5px} .rc-meta b{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--brand)}
.next-step{align-self:stretch;margin:12px 0 4px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--brand);box-shadow:0 6px 18px rgba(15,125,99,.10);display:flex;flex-direction:column;gap:6px;font-size:14px}
.next-step .ns-h{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand)}
html[data-theme="dark"] .next-step .ns-h{color:var(--brand-ink)}
.next-step p{margin:2px 0 0;font-size:13px;color:var(--muted)} .next-step .ns-i{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.next-step .ns-b{gap:6px;margin-top:4px} .next-step .rate-in button{color:var(--line)} .next-step .rate-in button.on{color:var(--accent)}
.ch-empty{margin:auto;text-align:center;color:var(--muted);display:grid;justify-items:center;gap:6px;max-width:260px}
.ch-soon{font-size:11.5px;color:var(--muted);text-align:center;padding:6px;background:var(--surface);border-top:1px solid var(--line)}
.ch-closed{display:flex;align-items:center;gap:10px;justify-content:center;padding:14px;background:var(--sunk);border-top:1px solid var(--line);color:var(--ink2);font-size:13px;text-align:left}
.chat.is-closed .msgs{filter:saturate(.85)}
.chat form .send{width:44px;height:44px;padding:0;border-radius:50%;flex-shrink:0;justify-content:center}
.chat form input{border-radius:99px !important;padding-left:16px}
.exp-row.need-rc{border-left:3px solid var(--accent);padding-left:8px} .btn.rc-ok{color:var(--ok);border-color:var(--kd-bfe2cd);background:var(--ok-soft)}
@media (max-width:640px){ .chat .msgs{max-height:none;min-height:52vh} .bub{max-width:86%} .ch-remind{flex-wrap:wrap} .ch-head .btn{padding:6px 9px} }
.chat .m{max-width:80%;padding:9px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.chat .m.me{align-self:flex-end;background:var(--brand);border-color:var(--brand);color:#fff}
.chat .m .w{font-size:11.5px;opacity:.7;margin-bottom:2px;font-weight:600}
.chat .m.sys{align-self:center;max-width:92%;background:var(--ok-soft);border-color:var(--kd-cbe6d6);color:var(--kt-0f4f30);font-size:13px;text-align:center;font-weight:600}
.chat .m.sys .ic{vertical-align:-3px}
.chat form{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
.chat form input{flex:1}

/* ====================== APP PRO ====================== */
.p-shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.p-side{background:var(--pro-side);color:#c9d4e3;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.p-side .plogo{display:flex;align-items:center;gap:9px;color:#fff;font-family:var(--f-display);font-weight:800;font-size:19px;padding:4px 8px 18px}
.p-side .plogo .logo-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--pro-side)}
.p-side .plogo small{font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent);margin-left:2px}
.p-side button.nav{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:#c9d4e3;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;text-align:left}
.p-side button.nav:hover{background:var(--pro-side2);color:#fff}
.p-side button.nav.on{background:#fff;color:var(--pro-side)}
html[data-theme="dark"] .p-side button.nav.on{background:#1f3350;color:#fff}
.p-side .count{margin-left:auto;background:var(--accent);color:var(--pro-side);border-radius:99px;font-size:11px;font-weight:800;padding:0 7px}
.p-side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--pro-side2);color:#fff}
.p-main{padding:30px 34px 110px;max-width:1120px;width:100%}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.kpi{padding:18px}

/* ====================== ESTILO AMIGABLE (v2) ====================== */
:root{
  --bg:#fbf8f3; --sunk:#f7f3ec; --line:#ebe5da; --line2:#f2ede4;
  --brand:#0f7d63; --brand-ink:#0a5e4a; --brand-soft:#e1f4ec; --accent:#ffb547; --accent-soft:#fff2d9;
  --ink:#1d2b27; --ink2:#44524d; --muted:#76837e;
  --r:14px; --r-lg:22px;
  --sh:0 1px 2px rgba(60,45,20,.04), 0 6px 18px rgba(60,45,20,.06);
  --sh-lg:0 24px 60px rgba(40,30,10,.20);
  --c-mint:#dff5ea; --c-mint-i:#0f7d63; --c-sun:#fff0cf; --c-sun-i:#a86400; --c-sky:#e0efff; --c-sky-i:#2a62c9;
  --c-lav:#ece6ff; --c-lav-i:#6a46c9; --c-peach:#ffe5da; --c-peach-i:#c2502a; --c-rose:#ffe3ee; --c-rose-i:#b83a6e;
}
body{background:var(--bg)}
.card{border-radius:var(--r-lg);border-color:var(--line)}
.btn{border-radius:12px} .btn.pri,.btn.dark{border-radius:999px;padding-left:20px;padding-right:20px}
.btn.lg{border-radius:999px} .btn.pri{box-shadow:0 6px 16px rgba(15,125,99,.22)} .btn.pri:hover{box-shadow:0 8px 20px rgba(15,125,99,.3)}
.in,.inp-group{border-radius:12px!important}
.c-top{background:color-mix(in srgb, var(--bg) 92%, transparent);border-bottom-color:transparent;box-shadow:0 1px 0 var(--line)}
.logo-mark{background:linear-gradient(140deg,#16a37f,#0f7d63);box-shadow:0 4px 10px rgba(15,125,99,.25)}
.c-nav button{border-radius:999px}
/* inicio */
.hero{background:radial-gradient(120% 140% at 0% 0%,#18a582 0%,#0f7d63 45%,#0b5d4b 100%);border-radius:28px;padding:34px 36px 30px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.hero > *{grid-column:1} .hero .h-art{grid-column:2;grid-row:1/span 3;align-self:center}
.hero h1{font-size:34px} .hero .wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.2s ease-in-out 1s 2}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
.hero .search{border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 10px 30px rgba(0,0,0,.15)} .hero .search .btn{border-radius:999px}
.hero .ring{border-color:rgba(255,255,255,.07)}
.h-art{width:250px;height:190px;position:relative;margin-right:10px}
.h-art .blob{position:absolute;inset:10px 20px;border-radius:44% 56% 52% 48%/50% 44% 56% 50%;background:rgba(255,255,255,.12);animation:blob 9s ease-in-out infinite}
@keyframes blob{50%{border-radius:56% 44% 46% 54%/44% 56% 44% 56%;transform:rotate(8deg)}}
.h-art .house{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.h-art .bub{position:absolute;display:flex;align-items:center;gap:6px;background:var(--kb-ffffff);color:var(--ink);font-size:12px;font-weight:700;border-radius:999px;padding:6px 10px 6px 7px;box-shadow:0 8px 20px rgba(0,0,0,.15);animation:float 4s ease-in-out infinite;white-space:nowrap}
.h-art .bub i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal}
.h-art .b1{left:-34px;top:2px} .h-art .b2{right:-26px;top:96px;animation-delay:-1.3s} .h-art .b3{left:-14px;bottom:0;animation-delay:-2.6s}
@keyframes float{50%{transform:translateY(-6px)}}
.cats{gap:14px}
.cat{border-radius:20px;border-color:transparent;box-shadow:var(--sh);padding:18px}
.cat:hover{border-color:transparent;transform:translateY(-3px);box-shadow:0 12px 28px rgba(60,45,20,.12)}
.cat .ci{width:48px;height:48px;border-radius:16px}
.cats .cat:nth-child(6n+1) .ci{background:var(--c-sun);color:var(--c-sun-i)}
.cats .cat:nth-child(6n+2) .ci{background:var(--c-sky);color:var(--c-sky-i)}
.cats .cat:nth-child(6n+3) .ci{background:var(--c-mint);color:var(--c-mint-i)}
.cats .cat:nth-child(6n+4) .ci{background:var(--c-peach);color:var(--c-peach-i)}
.cats .cat:nth-child(6n+5) .ci{background:var(--c-lav);color:var(--c-lav-i)}
.cats .cat:nth-child(6n+6) .ci{background:var(--c-rose);color:var(--c-rose-i)}
.trust .t{border-radius:20px;border-color:transparent;box-shadow:var(--sh)}
.trust .t:nth-child(1) .ti{background:var(--c-mint);color:var(--c-mint-i)} .trust .t:nth-child(2) .ti{background:var(--c-sun);color:var(--c-sun-i)} .trust .t:nth-child(3) .ti{background:var(--c-sky);color:var(--c-sky-i)}
.task-row,.pro-card{border-radius:20px;border-color:transparent;box-shadow:var(--sh)}
.task-row:hover,.pro-card:hover{border-color:transparent;box-shadow:0 10px 26px rgba(60,45,20,.11)}
.task-row .ti{border-radius:14px}
.pill{border-radius:999px}
.modal{border-radius:24px}
.empty{border-radius:20px}

/* ====================== SPLASH ====================== */
.splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 0%,#1cb08b 0%,#0f7d63 50%,#0a5644 100%);color:#fff;transition:opacity .45s ease,transform .45s ease;cursor:pointer}
.splash.pro{background:radial-gradient(120% 90% at 50% 0%,#2b4a78 0%,#16263e 55%,#0d1726 100%)}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:24px}
.sp-logo{width:96px;height:96px;border-radius:30px;display:grid;place-items:center;background:var(--kb-ffffff);color:var(--brand);box-shadow:0 20px 50px rgba(0,0,0,.25);animation:sp-pop .7s cubic-bezier(.2,1.4,.4,1) both}
.splash.pro .sp-logo{color:var(--kt-16263e)}
.sp-logo svg{animation:sp-turn 1.1s ease .45s both}
.sp-name{font-family:var(--f-display);font-weight:800;font-size:40px;letter-spacing:-.03em;animation:sp-up .6s ease .35s both}
.sp-name small{font-size:16px;font-weight:700;background:var(--accent);color:var(--kt-3a2600);border-radius:8px;padding:2px 8px;vertical-align:middle;margin-left:4px}
.sp-tag{font-size:16px;opacity:.85;animation:sp-up .6s ease .55s both}
.sp-dots{display:flex;gap:7px;margin-top:18px;animation:sp-up .5s ease .8s both}
.sp-dots i{width:8px;height:8px;border-radius:50%;background:var(--kb-ffffff);opacity:.4;animation:sp-dot 1s ease-in-out infinite}
.sp-dots i:nth-child(2){animation-delay:.15s} .sp-dots i:nth-child(3){animation-delay:.3s}
@keyframes sp-pop{from{transform:scale(.3) rotate(-20deg);opacity:0}}
@keyframes sp-turn{0%{transform:rotate(0)}40%{transform:rotate(-35deg)}100%{transform:rotate(0)}}
@keyframes sp-up{from{transform:translateY(14px);opacity:0}}
@keyframes sp-dot{50%{opacity:1;transform:translateY(-4px)}}

/* ====================== INTRO (primera vez) ====================== */
.intro{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);max-width:520px;margin:0 auto;padding:18px 24px calc(24px + env(safe-area-inset-bottom));user-select:none}
.intro-top{display:flex;align-items:center;justify-content:space-between}
.intro-top .brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:800;font-size:19px}
.intro-top .brand .logo-mark{width:32px;height:32px;border-radius:10px}
.intro-skip{border:0;background:transparent;font-weight:700;color:var(--muted);padding:10px 6px;cursor:pointer}
.intro-track{flex:1;overflow:hidden;position:relative;margin:10px -24px 0}
.intro-slides{display:flex;height:100%;transition:transform .45s cubic-bezier(.3,.9,.3,1)}
.intro-slide{flex:0 0 100%;display:flex;flex-direction:column;justify-content:center;padding:0 24px;text-align:center;gap:14px}
.intro-art{position:relative;width:260px;height:250px;margin:0 auto 10px}
.intro-art .disc{position:absolute;inset:14px;border-radius:50%}
.intro-art .disc2{position:absolute;inset:44px;border-radius:50%;background:rgba(255,255,255,.65)}
.intro-art .main{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:32px;background:var(--kb-ffffff);display:grid;place-items:center;box-shadow:0 18px 40px rgba(40,30,10,.14)}
.intro-art .chip{position:absolute;display:flex;align-items:center;gap:7px;background:var(--kb-ffffff);border-radius:999px;padding:7px 12px 7px 8px;font-size:13px;font-weight:700;box-shadow:0 10px 24px rgba(40,30,10,.12);white-space:nowrap;animation:float 4s ease-in-out infinite}
.intro-art .chip i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal}
.intro-art .ch0{left:-18px;top:10px} .intro-art .ch1{right:-44px;top:104px;animation-delay:-1.4s} .intro-art .ch2{left:4px;bottom:0;animation-delay:-2.7s}
.intro-slide.on .main{animation:sp-pop .6s cubic-bezier(.2,1.4,.4,1) both}
.intro-slide.on .chip{animation:sp-up .5s ease both,float 4s ease-in-out .6s infinite} .intro-slide.on .ch1{animation-delay:.12s,.7s} .intro-slide.on .ch2{animation-delay:.24s,.8s}
.intro-slide h1{font-size:28px;line-height:1.15}
.intro-slide p{color:var(--ink2);font-size:16px;max-width:380px;margin:0 auto}
.intro-dots{display:flex;justify-content:center;gap:8px;margin:18px 0}
.intro-dots button{width:9px;height:9px;border-radius:99px;border:0;background:var(--kb-d9d2c5);padding:0;cursor:pointer;transition:width .3s,background .3s}
.intro-dots button.on{width:28px;background:var(--brand)}
.intro-cta{display:flex;gap:10px} .intro-cta .btn{flex:1;padding-top:14px;padding-bottom:14px;font-size:16px}
.t-mint{background:var(--c-mint)} .t-mint i,.t-mint .ico{background:var(--c-mint);color:var(--c-mint-i)}
.t-sun{background:var(--c-sun)} .t-sun i,.t-sun .ico{background:var(--c-sun);color:var(--c-sun-i)}
.t-sky{background:var(--c-sky)} .t-sky i,.t-sky .ico{background:var(--c-sky);color:var(--c-sky-i)}
.ico-mint{color:var(--c-mint-i)} .ico-sun{color:var(--c-sun-i)} .ico-sky{color:var(--c-sky-i)}
@media (prefers-reduced-motion: reduce){ .splash *,.intro *,.h-art *{animation:none!important} .intro-slides{transition:none} }

@media (max-width:640px){
  .hero{grid-template-columns:1fr;padding:24px 20px 22px;border-radius:24px} .hero .h-art{display:none} .hero h1{font-size:26px}
  .cat{padding:14px;border-radius:18px} .cat .ci{width:44px;height:44px}
  .c-nav{left:10px!important;right:10px!important;bottom:calc(8px + env(safe-area-inset-bottom))!important;border:0!important;border-radius:22px;box-shadow:0 10px 30px rgba(40,30,10,.16);padding:6px!important}
  .c-nav button{border-radius:16px}
  .demo{bottom:calc(84px + env(safe-area-inset-bottom))}
  .intro-art{transform:scale(.92)}
}

/* ============================ Diseño minimalista ============================ */
/* Fuente del sistema (SF Pro en iPhone, Segoe en Windows), fondo neutro, líneas de 1 px,
   casi sin sombras. El verde es el único color de marca; el amarillo marca lo pendiente. */
:root{
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg:#f6f7f6; --surface:#ffffff; --sunk:#f1f3f2; --line:#e4e7e5; --line2:#eef0ef;
  --ink:#141816; --ink2:#3e4743; --muted:#6c7571;
  --brand:#0e6b55; --brand-ink:#0a5241; --brand-soft:#e7f1ed; --accent:#e9a23b; --accent-soft:#fcf3e3;
  --r:10px; --r-lg:18px;
  --sh:none; --sh-lg:0 24px 60px rgba(20,24,22,.16), 0 2px 6px rgba(20,24,22,.06);
  --kb-fffcf4:#ffffff; --kb-fff8e6:#ffffff; --kb-fffaf0:#ffffff; --kb-fffcf3:#ffffff; --kb-f6f4ef:var(--bg);
}
html[data-theme="dark"]{
  --bg:#0f1211; --surface:#161a19; --sunk:#1c2120; --line:#272d2b; --line2:#202624;
  --ink:#eceeed; --ink2:#c4cac7; --muted:#8c9592;
  --brand:#16856a; --brand-ink:#86d4bd; --brand-soft:#15302a; --accent:#e9a23b; --accent-soft:#33291a;
  --sh:none; --sh-lg:0 24px 60px rgba(0,0,0,.6);
  --kb-fffcf4:var(--surface); --kb-fff8e6:var(--surface); --kb-fffaf0:var(--surface); --kb-fffcf3:var(--surface); --kb-f6f4ef:var(--bg);
}
body{font-family:var(--f-body);font-size:15px;letter-spacing:-.006em;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.022em}
h1{font-size:30px;font-weight:700;line-height:1.12} h2{font-size:19px;font-weight:650} h3{font-weight:650}
.eyebrow{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* superficies */
.card{border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:none}
.modal{border-radius:20px;border:1px solid var(--line);box-shadow:var(--sh-lg)}
.ov{background:rgba(15,18,17,.38);backdrop-filter:blur(3px)}

/* controles */
.btn{border-radius:10px;font-weight:600;box-shadow:none!important;border-color:var(--line);transition:background .15s,border-color .15s,color .15s}
.btn.pri,.btn.dark{border-radius:10px;padding-left:16px;padding-right:16px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff} .btn.pri:hover{background:var(--brand-ink);border-color:var(--brand-ink)}
html[data-theme="dark"] .btn.pri:hover{background:#1a9a7b;border-color:#1a9a7b}
.btn:not(.pri):not(.danger):not(.call-hang):not(.call-ok):hover{background:var(--sunk);border-color:var(--line)}
.btn.lg{border-radius:12px}
.in,select.in,textarea.in,.inp-group{border-radius:10px!important;border-color:var(--line);background:var(--surface)}
.in:focus,select.in:focus,textarea.in:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);outline:none}
.chip{border-radius:999px;font-weight:500}
.pill{font-weight:600;font-size:12px;padding:3px 9px}

/* avisos: neutros, el color va solo en el ícono */
.notice,.notice.ok,.notice.info,.notice.warn,.notice.bad,.notice.plain{background:var(--surface);color:var(--ink2);border:1px solid var(--line);border-radius:14px}
.notice.ok>svg:first-child{color:var(--ok)} .notice.info>svg:first-child{color:var(--info)} .notice.warn>svg:first-child{color:var(--warn)} .notice.bad>svg:first-child{color:var(--bad)}
.notice.bad{border-color:color-mix(in srgb, var(--bad) 35%, var(--line))} .notice.warn{border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}

/* cabecera del cliente */
.c-top,html[data-theme="dark"] .c-top{background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:saturate(1.4) blur(12px);box-shadow:none;border-bottom:1px solid var(--line)}
.c-logo{font-weight:700;letter-spacing:-.03em}
.c-nav button{font-weight:500;color:var(--muted)} .c-nav button:hover{background:var(--sunk);color:var(--ink)}
.c-nav button.on{color:var(--ink);background:var(--sunk);font-weight:600}
.loc{background:transparent!important;border:1px solid var(--line)!important}

/* inicio del cliente: la pregunta grande es lo único llamativo */
.hero{background:none!important;color:var(--ink);padding:28px 0 8px;border-radius:0;display:block;overflow:visible}
.hero .ring,.hero .h-art,.hero .wave{display:none}
.hero .hi{font-size:15px;color:var(--muted);margin:0 0 6px;opacity:1}
.hero h1{color:var(--ink);font-size:clamp(34px,5.4vw,56px);line-height:1.02;letter-spacing:-.04em;max-width:15ch;font-weight:750}
.hero p{color:var(--muted);opacity:1;font-size:16px;margin-top:12px;max-width:52ch}
.hero .search{margin-top:24px;max-width:640px;border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 16px;box-shadow:none;background:var(--surface)}
.hero .search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.hero .search .btn{border-radius:10px}
.cats{gap:10px}
.cat,.cats .cat{border:1px solid var(--line);border-radius:16px;box-shadow:none;padding:16px;background:var(--surface)}
.cat:hover{border-color:color-mix(in srgb, var(--ink) 22%, var(--line));transform:none}
.cats .cat .ci,.cat .ci{background:var(--sunk)!important;color:var(--ink)!important;width:40px;height:40px;border-radius:12px}

.task-row,.pro-card,.trust .t{border:1px solid var(--line);border-radius:18px;box-shadow:none}
.task-row:hover,.pro-card:hover{border-color:color-mix(in srgb, var(--ink) 22%, var(--line));box-shadow:none}
.cat:hover{box-shadow:none}
/* pestañas tipo control segmentado */
.ttabs{background:var(--sunk);border:0;border-radius:12px;padding:4px;gap:2px}
.ttabs button{font-weight:600;color:var(--muted);border-radius:9px;padding:8px 14px}
.ttabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,24,22,.08),0 0 0 1px var(--line)}
.ttabs button.on .count{background:var(--brand);color:#fff}
.go-card:hover{box-shadow:none;border-color:color-mix(in srgb, var(--ink) 22%, var(--line))}

/* progreso de la tarea */
.tracker .st .dot{width:18px;height:18px;border-width:1.5px}
.tracker .st:not(:last-child):after{top:8.5px;left:18px;height:1.5px}
.tracker .st.cur .dot{box-shadow:0 0 0 3px var(--brand-soft)}

/* app del profesional: barra lateral clara */
.p-side{background:var(--surface);color:var(--ink2);border-right:1px solid var(--line)}
.p-side .plogo{color:var(--ink)} .p-side .plogo small{color:var(--brand)}
.p-side button.nav{color:var(--muted);font-weight:500}
.p-side button.nav:hover{background:var(--sunk);color:var(--ink)}
.p-side button.nav.on,html[data-theme="dark"] .p-side button.nav.on{background:var(--sunk);color:var(--ink);font-weight:600}
.p-side .me{background:transparent!important;border:1px solid var(--line)!important}
.p-side .me .sb{color:var(--ink)} .p-side .me .xs{color:var(--muted)!important}
.p-side .me .icon-btn{color:var(--ink2)!important;border-color:var(--line)!important;background:transparent!important}
.kpi .v{font-weight:650;letter-spacing:-.035em}

html[data-theme="dark"] .btn.dark,html[data-theme="dark"] .chip.on,html[data-theme="dark"] .map-tools button.on,html[data-theme="dark"] .map-hint{color:var(--bg)}
html[data-theme="dark"] .chip.on .count,html[data-theme="dark"] .chip.on span{color:var(--bg)}
/* consola de soporte: misma barra lateral clara */
.z-side{background:var(--surface);color:var(--ink2);border-right:1px solid var(--line)}
.z-brand{color:var(--ink)} .z-brand small{color:var(--muted)} .z-brand .logo-mark{background:var(--brand);color:#fff}
.z-grp,.k-side .grp{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600;color:var(--muted)}
.z-nav{color:var(--muted);font-weight:500} .z-nav:hover{background:var(--sunk);color:var(--ink)}
.z-nav.on{background:var(--sunk);color:var(--ink);font-weight:600} .z-nav.on .z-count{background:var(--bad)}
.z-agent{border-top-color:var(--line);color:var(--ink)}
.tbl th,.k-card h3{text-transform:none;letter-spacing:0;font-weight:600}
.k-side .klogo .logo-mark{background:var(--brand)}

/* chat */
.chat{box-shadow:none;border-radius:18px}
.chat .msgs,html[data-theme="dark"] .chat .msgs{background:var(--bg);background-image:none}
.bub{border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line)} .bub.me{box-shadow:none}
.ev{background:transparent;border:0;color:var(--muted);padding:4px 10px} .ev .ev-i{background:var(--sunk);color:var(--ink2)}
.ev.ask{background:var(--surface);border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line));color:var(--ink2)} .ev.ask .ev-i{background:var(--accent-soft);color:var(--warn)}
.ch-day span{border:0;background:var(--sunk);color:var(--muted);font-weight:600;text-transform:none}
.next-step{border:1px solid var(--line);box-shadow:none;border-left:3px solid var(--brand)}
.next-step .ns-h{text-transform:none;letter-spacing:0;font-size:12px;font-weight:600}
.ch-remind{background:var(--surface);border-bottom:1px solid var(--line);color:var(--ink2)} .ch-remind>svg{color:var(--warn)}
.offer-m{box-shadow:none} .offer-m.live{border-color:var(--accent);box-shadow:none}

/* inicio de la demo e introducción */
.launch{background:var(--bg)}
.launch h1{font-size:clamp(32px,5vw,48px);letter-spacing:-.04em;line-height:1.05}

@media (max-width:640px){
  .hero{padding-top:16px} .hero h1{font-size:36px}
  .modal{border-radius:20px 20px 0 0;border-bottom:0}
  .p-side{border-right:0;border-top:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

  o.status='aceptada'; o.decidedAt=now(); const before=t.labor!=null?t.labor:null, total=totalFor(t, o.amount);

// Precio que ve el cliente por hora: tarifa del profesional + margen, redondeado a L5.
const clientRate = proRate => Math.ceil(proRate*(1+S.settings.margin)/5)*5;
function money(t){
  const dep = t.deposit ? t.deposit.amount : depAmt(t);
  const estimate = estTotal(t), proEstimate = isPrice(t) ? t.proRate : r2(t.estHours*t.proRate);
  if(t.status==='cancelada' || t.status==='rechazada'){
    const late = !!(t.cancel && t.cancel.by==='client' && t.cancel.late);
    const fee = late ? dep : 0, proComp = late ? (isPrice(t) ? proShare(dep) : r2(t.proRate*DEP_HOURS)) : 0;
    return {cancelled:true, late, dep, fee, hours:0, exp:0, tip:0, labor:0, proLabor:0, clientTotal:fee, refunded:late?0:dep, refundedPro:0, charged:fee, cardCharged:fee, cash:0, proTotal:proComp, proNet:proComp, platform:r2(fee-proComp), balance:0, estimate, proEstimate};
  }
  const hours = isPrice(t) ? 1 : t.invoice ? t.invoice.hours : t.billed ? t.billed.hours : t.estHours;
  const exp = t.invoice ? t.invoice.expenses.reduce((a,e)=>a+(+e.amount||0),0) : 0;
  const tip = +t.tip||0;
  const refunds = (t.refunds||[]);
  const refunded = refunds.reduce((a,r)=>a+r.amount,0);
  const refundedPro = refunds.filter(r=>r.absorb==='pro').reduce((a,r)=>a+r.amount,0);
  const labor = r2(hours*t.clientRate), proLabor = r2(hours*t.proRate);
  const clientTotal = r2(labor+exp+tip);
  const proTotal = r2(proLabor+exp+tip-refundedPro);
  const credit = +t.creditApplied||0;
  // Efectivo: el cliente le paga el saldo al profesional; ChambaYa ya tiene el depósito y descuenta su parte de los pagos al profesional.
  const cash = t.payMethod==='efectivo' ? Math.max(0, r2(clientTotal-dep-credit)) : 0;
  const charged = r2(clientTotal-refunded-credit);
  const uncollected = r2((t.debts||[]).filter(d=>d.status==='pendiente').reduce((a,d)=>a+d.amount,0));
  return {hours, exp, tip, labor, proLabor, clientTotal, dep, credit, uncollected, balance:r2(clientTotal-dep), refunded:r2(refunded), refundedPro:r2(refundedPro), charged, cardCharged:r2(charged-cash), cash, proTotal, proNet:r2(proTotal-cash),
          platform:r2(labor-proLabor-(refunded-refundedPro)-credit), estimate, proEstimate};
}

function ringPath(ring, pr, W, H){
  let out='', last=null, n=0, minx=1e9, miny=1e9, maxx=-1e9, maxy=-1e9; const pts=[];
  for(const [ln,la] of ring){ const p=pr(la,ln); if(p[0]<minx)minx=p[0]; if(p[0]>maxx)maxx=p[0]; if(p[1]<miny)miny=p[1]; if(p[1]>maxy)maxy=p[1];
    if(!last || Math.abs(p[0]-last[0])+Math.abs(p[1]-last[1])>0.9){ pts.push(p); last=p; } }
  if(maxx<-50 || maxy<-50 || minx>W+50 || miny>H+50 || pts.length<3) return '';

function geoLayer(view, W, H, pr, zoom){
  const key=[view.lat,view.lng,view.km,W,H].join(); if(GEO_CACHE.has(key)) return GEO_CACHE.get(key);

  if(poly && poly.length>2) g += `<path d="${ptsPath(poly.map(([la,ln])=>pr(la,ln)))}" fill="#0b5d4b" fill-opacity=".22" stroke="#0b5d4b" stroke-width="2.5" stroke-linejoin="round"/>`;
  g += `<path id="${id||'m'}-live" d="" fill="#0b5d4b" fill-opacity=".12" stroke="#0b5d4b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  // ciudades
  if(labels) CITIES.forEach(c=>{ if(!zoom && !c.major) return; const [x,y]=pr(c.lat,c.lng); if(x<-20||y<-20||x>W+20||y>H+20) return;
    g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${c.major?4:3}" fill="#13211d" stroke="#fff" stroke-width="1.5"/><text x="${(x+7).toFixed(1)}" y="${(y+4).toFixed(1)}" font-size="${zoom?(c.major?14:12):12}" font-weight="${c.major?700:600}" fill="#13211d" paint-order="stroke" stroke="#fff" stroke-width="3" font-family="Figtree, system-ui">${esc(c.name)}</text>`; });
  // centro
  if(center){ const [x,y]=pr(center.lat,center.lng); g += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><circle r="9" fill="#f2b13a" stroke="#13211d" stroke-width="2"/><circle r="2.5" fill="#13211d"/></g>`; }
  // escala
  if(zoom){ const len=10*s; g += `<g transform="translate(16 ${H-22})"><rect x="-6" y="-16" width="${len+44}" height="28" rx="6" fill="#fff" fill-opacity=".9"/><line x1="0" y1="0" x2="${len.toFixed(1)}" y2="0" stroke="#13211d" stroke-width="3"/><text x="${(len+6).toFixed(1)}" y="4" font-size="12" font-weight="700" font-family="Figtree">10 km</text></g>`; }
  if(GEO) g += `<text x="${W-8}" y="${H-8}" text-anchor="end" font-size="10" fill="#6b7a76" paint-order="stroke" stroke="#fff" stroke-width="3" font-family="Figtree,system-ui,sans-serif">Límites: amCharts · carreteras aproximadas</text>`;
  return `<svg id="${id||'m'}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de Honduras">${g}</svg>`;
}

    </div></div>`;

function bindMap(){
  const svg = document.getElementById('drawmap'); if(!svg || !UI.map) return;
  const m = UI.map, W=760, H=480;
  const view = () => m.zoom ? {lat:m.center.lat, lng:m.center.lng, km:ZOOM_KM} : COUNTRY;
  const loc = e => { const r=svg.getBoundingClientRect(); return [(e.clientX-r.left)*W/r.width, (e.clientY-r.top)*H/r.height]; };
  let drawing=false, pts=[];
  svg.addEventListener('pointerdown', e=>{
    const [x,y]=loc(e), v=view();
    if(!m.zoom || m.mode==='center'){ const [la,ln]=unproject(v,W,H,x,y); m.center={lat:+la.toFixed(5), lng:+ln.toFixed(5)}; m.zoom=true; m.mode='draw'; m.poly=null; m.cityId=nearestCity(la,ln).id; rerender(); return; }
    drawing=true; pts=[]; svg.setPointerCapture(e.pointerId); add(x,y);
  });
  const add = (x,y) => {
    const v=view(); let [la,ln]=unproject(v,W,H,x,y); let [kx,ky]=toKm(m.center, la, ln); const d=Math.hypot(kx,ky);
    if(d>MAX_R*0.995){ kx*=MAX_R*0.995/d; ky*=MAX_R*0.995/d; [la,ln]=fromKm(m.center,kx,ky); }
    const p=project(v,W,H,la,ln); const last=pts[pts.length-1];
    if(!last || Math.hypot(p[0]-last.p[0], p[1]-last.p[1])>4){ pts.push({p, ll:[la,ln]}); document.getElementById('drawmap-live').setAttribute('d', ptsPath(pts.map(q=>q.p), false)); }
  };
  svg.addEventListener('pointermove', e=>{ if(drawing){ const [x,y]=loc(e); add(x,y); } });
  const end = () => { if(!drawing) return; drawing=false;
    if(pts.length<8){ toast('Dibujá un contorno más grande alrededor de tu zona','alert'); document.getElementById('drawmap-live').setAttribute('d',''); return; }
    const step = Math.max(1, Math.floor(pts.length/70)); const poly = pts.filter((_,i)=>i%step===0).map(q=>[+q.ll[0].toFixed(5), +q.ll[1].toFixed(5)]);
    const st = polyStats(m.center, poly);
    if(st.area < 4){ toast('La zona es muy pequeña. Dibujá un área más amplia.','alert'); document.getElementById('drawmap-live').setAttribute('d',''); return; }
    if(!inPoly(m.center.lat, m.center.lng, poly)) toast('Tip: tu centro quedó fuera de la zona. Revisá que cubra donde vivís.','alert');
    m.poly = poly; rerender(); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
}
function nearestCity(la, ln){ let b=CITIES[0], bd=1e9; CITIES.forEach(c=>{ const d=Math.hypot(...toKm({lat:la,lng:ln}, c.lat, c.lng)); if(d<bd){bd=d;b=c;} }); return b; }
function areaPreview(area){ return `<div class="map-wrap">${mapSVG({view:{lat:area.center.lat, lng:area.center.lng, km:ZOOM_KM}, id:'pv'+Math.random().toString(36).slice(2,7), poly:area.poly, circle:area.center, center:area.center})}</div>`; }

function visitRange(catId){ const v=Object.values(S.pros).filter(p=>p.status==='aprobado' && p.services[catId]).map(visitFee).sort((a,b)=>a-b);
  return v.length ? {lo:v[0], hi:v[v.length-1], n:v.length} : null; }

/* ----- tareas del cliente ----- */
function cliTasks(){
  const mine = S.tasks.filter(t=>t.client===S.sessions.cliente).sort((a,b)=>b.date.localeCompare(a.date));
  const closed = ['completada','cancelada','rechazada'];
  const act = mine.filter(t=>!closed.includes(t.status)), past = mine.filter(t=>closed.includes(t.status));
  return `<div class="row between" style="margin-bottom:20px"><div><h1>Mis tareas</h1><p class="muted" style="margin-top:4px">Seguimiento, facturas y calificaciones.</p></div><button class="btn pri" data-act="cli-nav" data-v="home">${ic('plus',16)} Nueva tarea</button></div>
    <div class="stack loose"><section class="stack tight"><h2>Activas</h2>${act.length?act.map(cliTaskRow).join(''):`<div class="empty"><span class="ei">${ic('cal',22)}</span>No tenés tareas activas.</div>`}</section>
    <section class="stack tight"><h2>Historial</h2>${past.length?past.map(cliTaskRow).join(''):`<p class="muted sm">Aún no hay tareas completadas.</p>`}</section></div>`;
}
const FLOW = [['solicitada','Invitación'],['aceptada','Confirmada'],['en_camino','En camino'],['en_progreso','Trabajando'],['factura_enviada','Factura'],['completada','Pagada']];
function tracker(t){
  const order = FLOW.map(f=>f[0]); let idx = order.indexOf(t.status==='en_disputa'?'factura_enviada':t.status);
  return `<div class="tracker">${FLOW.map(([k,l],i)=>`<div class="st ${i<idx||t.status==='completada'?'done':i===idx?'cur':''}"><span class="dot">${i<idx||t.status==='completada'?ic('check',12,'stroke-width="3"'):''}</span><span>${l}</span></div>`).join('')}</div>`;
}

}
function chatBox(taskId, meId, prompts){
  const all = S.chats.map((c,i)=>[c,i]).filter(([c])=>c.task===taskId && !(c.kind==='blocked' && c.from!==meId) && !c.replaced);

  const nx = tk ? nextStep(tk, meId) : '';

  if(t.status==='cancelada') action = t.cancel?.by==='pro'

    : `<div class="notice ${m.late?'warn':'plain'}">${ic('x',18)}<span>Cancelaste esta tarea. ${m.late?`Como faltaban menos de 24 horas, se cobró el depósito de ${L(m.fee)}.`:`Te devolvimos el depósito de ${L(m.dep)}.`}</span></div>`;

  let invBlock = '';

        ${tipSel.k==='custom'?`<div class="inp-group" style="margin-top:8px;max-width:200px"><span>L</span><input type="number" min="0" step="10" value="${tipSel.v||''}" data-inp="tip-custom" aria-label="Propina"></div>`:''}

    invBlock = `<div class="card">${invoiceClient(t,{label:t.status==='completada'?'pagada':'en revisión'})}</div>`;
  }

    review = `<form class="card stack" data-form="review" data-id="${t.id}"><h2>¿Cómo te fue con ${pn}?</h2><div class="rate-in">${[1,2,3,4,5].map(n=>`<button type="button" data-act="rate" data-n="${n}" class="${n<=rv?'on':''}" aria-label="${n} estrellas"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor">${STAR}</svg></button>`).join('')}</div>

  const open = ['solicitada','aceptada'].includes(t.status);
  const closed = ['cancelada','rechazada'].includes(t.status);
  const tab = UI.cli.tab || 'resumen', nMsg = S.chats.filter(c=>c.task===t.id && c.from!=='sys' && c.kind!=='blocked').length;
  const proCard = `<div class="card stack"><div class="row">${av(t.pro,48)}<div><div class="b">${esc(dn(t.pro))}</div><div class="sm muted">${stars(score(p),13)} ${scoreTxt(p)} · ${pct(cumpl(p))} cumplidas</div></div></div><span class="verified">${ic('shield',15)} Identidad y antecedentes verificados</span></div>`;
  const payCard = `<div class="card stack tight"><h3>Pago</h3><div class="inv">
        ${isPrice(t)&&t.labor!=null?visitLines(t)+`<div class="ln b"><span class="d">Total del servicio</span><span class="v money">${L(t.clientRate)}</span></div>`

        ${isPrice(t)?'':t.invoice&&!closed?`<div class="ln"><span class="d">Horas trabajadas</span><span class="v">${H(m.hours)}</span></div>`:`<div class="ln"><span class="d">Estimado (${H(t.estHours)})</span><span class="v money">${L(m.estimate)}</span></div>`}
        <div class="ln"><span class="d">${t.deposit?.held?'Visita técnica':isPrice(t)?'Depósito':'Depósito (1 hora)'}</span><span class="v money">${L(m.dep)}</span></div>
        <div class="ln"><span class="d">${t.deposit?.held?'Estado de la visita':'Estado del depósito'}</span><span class="v b">${{retenido:'Retenida en tu tarjeta', cobrado:'Pagado', aplicado:t.deposit?.held?'Incluida en el cobro final':'Aplicado a la factura', reembolsado:t.deposit?.held?'Liberada (no se cobró)':'Reembolsado', cargo_cancelacion:'Cobrada por cancelación'}[t.deposit?.status]||'—'}</span></div>
        <div class="ln"><span class="d">Tarjeta</span><span class="v">${esc(t.card)}</span></div>
        <div class="ln"><span class="d">Saldo final</span><span class="v">${isCash(t)?'Efectivo al profesional':'Con tarjeta'}</span></div>
        ${t.hold?`<div class="ln"><span class="d">Retención<small>${t.hold.status==='retenido'?'Apartado en tu tarjeta, no es un cobro':t.hold.status==='aplicado'?(isPrice(t)?'Se usó en el cobro final; el resto se liberó':'Se cobró lo trabajado; el resto se liberó'):'Liberada'}</small></span><span class="v">${L(t.hold.amount)}</span></div>`:''}</div></div>`;
  const policyCard = `${open?`<div class="card stack tight" style="background:var(--kb-fffcf4);border-color:var(--kd-f1d9a6)"><h3>${ic('alert',16)} Política de cancelación</h3><p class="xs" style="color:var(--ink2)">${t.status==='solicitada'?'Mientras la invitación no esté confirmada, podés cancelar sin costo.':hoursTo(t)>FREE_CANCEL_H?`Cancelación sin costo hasta el <b>${fdate(cancelDeadline(t))}, ${ftime(t.date)}</b>. Después se cobra el depósito de ${L(m.dep)}.`:`Faltan menos de 24 horas: si cancelás se cobra el depósito de ${L(m.dep)}.`}</p></div>`:''}`;
  const actionsRow = `<div class="row wrap">${open&&!t.resched?`<button class="btn sm" data-act="resched-open" data-id="${t.id}">${ic('cal',15)} Reagendar</button>`:''}${open?`<button class="btn danger sm" data-act="cli-cancel" data-id="${t.id}">Cancelar tarea</button>`:''}<button class="btn sm" data-act="cli-ticket-new" data-task="${t.id}">${ic('headset',15)} Soporte</button></div>`;
  const detailsCard = `<div class="card stack tight"><h3>Detalles</h3><p class="sm">${esc(t.details)}</p><div class="grid g2 sm" style="margin-top:6px"><div class="row">${ic('cal',16)} ${fdate(t.date)} · ${slotText(t)}</div><div class="row">${ic('pin',16)} ${esc(t.address)}</div></div></div>`;
  const invTotal = t.invoice ? r2(m.labor+m.exp+(t.status==='factura_enviada'?0:m.tip)) : null;
  const invNotice = t.status==='factura_enviada'
    ? `<div class="card row between wrap" style="border-color:var(--brand)"><div><h2>Tu factura está lista</h2><p class="sm muted" style="margin-top:3px">${pn} terminó el trabajo. Revisala, agregá propina si querés y aprobala.</p></div><button class="btn pri" data-act="cli-tab" data-v="factura">${ic('receipt',16)} Ver factura</button></div>`
    : t.status==='completada' && t.invoice ? `<div class="notice ok">${ic('check',18)}<span class="grow">Factura pagada: <b>${L(m.charged)}</b>.</span><button class="btn sm" data-act="cli-tab" data-v="factura">Ver factura</button></div>` : '';
  const tabBar = `<div class="ttabs" role="tablist">${[['resumen','home','Resumen',''],['chat','msg','Chat',nMsg?`<span class="count">${nMsg}</span>`:''],['factura','receipt','Factura',t.status==='factura_enviada'?'<span class="dot"></span>':'']].map(([k,i,l,x])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-act="cli-tab" data-v="${k}">${ic(i,16)} ${l}${x}</button>`).join('')}</div>`;
  const head = `<button class="btn ghost sm" style="margin-bottom:14px" data-act="cli-nav" data-v="tasks">${ic('left',15)} Mis tareas</button>
    <div class="row between top wrap" style="margin-bottom:14px"><div><div class="eyebrow">${t.id} · ${cat(t.cat).name}</div><h1 style="margin-top:4px">${esc(t.title)}</h1></div>${pill(TASK_ST,t.status)}</div>${tabBar}`;
  if(tab==='chat') return head + `<div class="tab-body" style="max-width:820px">${closed?'<p class="sm muted">El chat se cerró porque la tarea se canceló.</p>':`${extBanner(t)}${chatBox(t.id, t.client)}`}</div>`;
  if(tab==='factura') return head + `<div class="book tab-body"><div class="stack">${invBlock || `<div class="empty">${ic('receipt',30)}<h3>Todavía no hay factura</h3><p class="sm muted">${isPrice(t)&&!t.quoted?`Primero ${pn} revisa el problema y te manda su presupuesto en el chat.`:`Cuando ${pn} termine el trabajo, la factura aparece aquí para que la apruebes.`}</p></div>`}</div><aside class="stack sum">${payCard}</aside></div>`;
  return head + `<div class="book tab-body"><div class="stack">
      ${!closed?`<div class="card">${tracker(t)}</div>`:''}
      ${debtBanner(t.client)}${reschedBanner(t, t.client)}${extBanner(t)}${action}${invNotice}${review}
      ${detailsCard}
      ${!closed?`<div class="grid g2"><button class="card go-card" data-act="cli-tab" data-v="chat">${ic('msg',22)}<span><b>Chat con ${pn}</b><small>${nMsg?`${nMsg} mensajes`:'Escribile o negociá el precio'}</small></span>${ic('right',16)}</button><button class="card go-card" data-act="cli-tab" data-v="factura">${ic('receipt',22)}<span><b>Factura y pago</b><small>${t.status==='factura_enviada'?'Por aprobar':t.invoice?'Ver detalle':'Retenciones y cobros'}</small></span>${ic('right',16)}</button></div>`:''}
    </div>
    <aside class="stack sum">${proCard}${policyCard}${actionsRow}</aside></div>`;
}

function ticketThreadUser(tk, uid){

  const p = pme(), u = U(p.id), v = UI.pro.view;

  const act = S.tasks.filter(t=>t.pro===p.id && ['aceptada','en_camino','en_progreso'].includes(t.status)).length;
  const nav = [['inicio','home','Inicio'],['solicitudes','inbox','Invitaciones',reqs],['tareas','cal','Mis tareas',act],['horario','clock','Mi horario'],['ganancias','wallet','Ganancias'],['perfil','user','Perfil y cuenta'],['soporte','headset','Soporte']];
  const curNav = v==='tarea' ? (T(UI.pro.task)?.status==='solicitada'?'solicitudes':'tareas') : v;
  return `<div class="p-shell"><aside class="p-side"><div class="plogo"><span class="logo-mark">${ic('wrench',17)}</span>ChambaYa<small>PRO</small></div>
    ${nav.map(([k,i,t,c])=>`<button class="nav ${curNav===k?'on':''} ${['horario','perfil','soporte'].includes(k)?'hide-m':''}" data-act="pro-nav" data-v="${k}">${ic(i,18)} <span class="nl">${t}</span><span class="ns">${({solicitudes:'Invitac.',tareas:'Tareas',horario:'Horario',ganancias:'Ganancias',perfil:'Perfil',soporte:'Soporte'})[k]||t}</span>${c?`<span class="count">${c}</span>`:''}</button>`).join('')}

function renderPro(){
  if(UI.pro.onb) return proOnboarding();
  if(!introSeen('pro')) return introScreen('pro');
  if(!S.sessions.pro || !P(S.sessions.pro)) return proLogin();
  const p = pme(), v = UI.pro.view;
  if(p.status!=='aprobado' && !['perfil','soporte','horario'].includes(v)) return proShell(proPending());
  let c='';
  if(v==='inicio') c=proHome(); else if(v==='solicitudes') c=proRequests(); else if(v==='tareas') c=proTasks(); else if(v==='tarea') c=proTask(T(UI.pro.task)); else if(v==='horario') c=proSchedule(); else if(v==='ganancias') c=proEarnings(); else if(v==='perfil') c=proProfile(); else if(v==='soporte') c=proHelp();
  return proShell(c);
}
function proPending(){
  const p = pme(); const docs = Object.entries(DOCS).map(([k,n])=>({k,n,d:p.docs[k]||{st:'faltante'}}));

/* ===== Ficha de tarea (estilo herramienta interna) ===== */
function riskOf(t){
  const r=[]; const arr=t.arrival?.at||t.startedAt; const lm=arr?Math.round((new Date(arr)-new Date(t.date))/6e4):0;
  const logged = t.startedAt&&t.endedAt ? (new Date(t.endedAt)-new Date(t.startedAt))/36e5 : null; const p=P(t.pro);
  if(t.status==='en_disputa') r.push({sev:'alta', t:'Factura en disputa', d:'El cliente reportó un problema con la factura.'});
  if(lm>10) r.push({sev:'alta', t:`Llegada ${lm} min tarde`, d:`Programada a las ${ftime(t.date)}; llegó a las ${ftime(arr)}${t.arrival?` (GPS a ${t.arrival.dist} m)`:''}.`});
  if(logged!=null && t.invoice && t.invoice.hours-logged>0.5) r.push({sev:'alta', t:'Horas facturadas mayores al registro', d:`Facturó ${H(t.invoice.hours)}; la app registró ${H(r2(logged))}.`});
  if(t.endUnconfirmed) r.push({sev:'media', t:'Fin sin confirmación del cliente', d:`Cerrado por el profesional a las ${ftime(t.endedAt)}.`});
  if(t.startUnconfirmed) r.push({sev:'media', t:'Inicio sin confirmación del cliente', d:`Iniciado por el profesional a las ${ftime(t.startedAt)}.`});
  if(t.invoice && t.invoice.expenses.some(e=>!e.receipt)) r.push({sev:'media', t:'Gastos sin recibo', d:t.invoice.expenses.filter(e=>!e.receipt).map(e=>`${e.desc} (${L(e.amount)})`).join(', ')});
  if(pendingDebts(t).length) r.push({sev:'alta', t:'Cobro rechazado al cliente', d:`Pendiente ${L(pendingDebts(t).reduce((a,d)=>a+d.amount,0))}. El profesional cobra igual; la cuenta del cliente queda bloqueada hasta que pague.`});
  if(t.billed?.uncoveredMin) r.push({sev:'baja', t:'Tiempo fuera de lo aprobado', d:`${t.billed.uncoveredMin} min trabajados sin extensión aprobada (no se cobraron).`});
  if(t.cash?.status==='no_recibido') r.push({sev:'alta', t:'Efectivo no recibido', d:`${dn(t.pro)} reporta que no recibió ${L(t.cash.amount)}. Se puede cobrar a la tarjeta del cliente desde el resumen.`});
  else if(t.cash?.status==='pendiente' && (Date.now()-new Date(t.cash.at))/36e5>24) r.push({sev:'media', t:'Efectivo sin confirmar', d:'El profesional no ha confirmado el pago en efectivo en más de 24 horas.'});
  const fl = contactFlags(t); if(fl.length){ const who=[...new Set(fl.map(x=>x.from))]; r.push({sev:'media', t:`${fl.length} intento${fl.length>1?'s':''} de compartir contacto`, d:`${who.map(w=>dn(w)).join(' y ')} intentó pasar datos fuera de la app. Ver pestaña Chat.`}); }
  const openTk = S.tickets.filter(k=>k.task===t.id && k.status!=='resuelto'); if(openTk.length) r.push({sev:'media', t:`${openTk.length} ticket${openTk.length>1?'s':''} abierto${openTk.length>1?'s':''}`, d:openTk.map(k=>k.id).join(', ')});
  if(t.resched) r.push({sev:'baja', t:'Reagendamiento pendiente', d:`Propuesto por ${dn(t.resched.by)}: ${fdt(t.resched.date)}.`});
  if(recentCancels(p)) r.push({sev:'baja', t:`${first(dn(t.pro))} canceló ${recentCancels(p)} visita${recentCancels(p)>1?'s':''} en 90 días`, d:`Calificación ${scoreTxt(p)} · cumplimiento ${pct(cumpl(p))}.`});
  const lc = clientStats(t.client).lateCancels; if(lc) r.push({sev:'baja', t:`El cliente tiene ${lc} cancelación${lc>1?'es':''} tardía${lc>1?'s':''}`, d:''});
  return r;
}
function riskBadge(t){ const r=riskOf(t); if(r.some(x=>x.sev==='alta')) return `<span class="bdg b-risk">En riesgo · ${r.length}</span>`; if(r.some(x=>x.sev==='media')) return `<span class="bdg b-warn">Revisar · ${r.length}</span>`; return `<span class="bdg b-ok">Sin riesgo</span>`; }
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const stamp = iso => { const d=new Date(iso); return `${d.getDate()} de ${MONTHS[d.getMonth()]} de ${d.getFullYear()}, ${ftime(iso)} CST`; };
const shortName = id => { const n=dn(id).split(' '); return n[0]+(n[1]?' '+n[1][0]+'.':''); };
function chatThread(t){
  const showEv = UI.con.showEv !== false;
  const arr = t.arrival?.at || t.startedAt; const lateMin = arr ? Math.round((new Date(arr)-new Date(t.date))/6e4) : null;
  const logged = t.startedAt&&t.endedAt ? (new Date(t.endedAt)-new Date(t.startedAt))/36e5 : null;

function shrinkPhoto(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const img=new Image(); img.onerror=rej; img.onload=()=>{ const s=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=192; c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,192,192); res(c.toDataURL('image/jpeg',.82)); }; img.src=r.result; }; r.readAsDataURL(file); }); }

const finDate = t => t.approvedAt || t.cancel?.at || t.date;
function finRows(period){
  const from = period==='todo' ? 0 : Date.now() - (+period)*864e5;
  const fee = S.settings.procFee ?? 0.035;
  return S.tasks.filter(t=>payable(t) && new Date(finDate(t)).getTime()>=from).map(t=>{ const m=money(t);
    const proc = r2((m.cardCharged ?? m.charged)*fee); // el efectivo no paga comisión del procesador
    return {t, at:finDate(t), uncol:m.uncollected||0, charged:m.charged, cash:m.cash||0, pro:m.proTotal, tip:m.tip||0, exp:m.exp||0, credit:m.credit||0, refunded:m.refunded||0, margin:m.platform, proc, net:r2(m.platform-proc-(m.uncollected||0)), late:!!m.cancelled};
  }).sort((a,b)=>b.at.localeCompare(a.at));
}
const sum = (a,k) => r2(a.reduce((s,x)=>s+x[k],0));
function finChart(rows, period){
  const days = period==='todo' ? 30 : Math.min(30, +period), out=[];
  for(let i=days-1;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); const k=d.toDateString();
    out.push({d, v:r2(rows.filter(r=>new Date(r.at).toDateString()===k).reduce((s,r)=>s+r.net,0))}); }
  const max=Math.max(1,...out.map(x=>Math.abs(x.v))), W=720, Hh=170, bw=W/out.length;
  return `<svg viewBox="0 0 ${W} ${Hh+22}" class="fin-chart" role="img" aria-label="Ganancia neta por día">
    <line x1="0" x2="${W}" y1="${Hh}" y2="${Hh}" stroke="#d9e0ea"/>
    ${out.map((x,i)=>{ const h=Math.abs(x.v)/max*(Hh-14); const y=x.v>=0?Hh-h:Hh;
      return `<g><title>${fdate(x.d.toISOString())}: ${L(x.v)}</title><rect x="${i*bw+bw*.18}" y="${y}" width="${bw*.64}" height="${Math.max(h, x.v?2:0)}" rx="3" fill="${x.v<0?'#d9534f':'#6d4bd8'}"/>${((i%Math.ceil(out.length/8)===0 && out.length-1-i>=Math.ceil(out.length/8)/2)||i===out.length-1)?`<text x="${i*bw+bw/2}" y="${Hh+16}" text-anchor="middle" font-size="11" fill="#7a869a">${x.d.getDate()}/${x.d.getMonth()+1}</text>`:''}</g>`; }).join('')}
  </svg>`;
}
function finGroup(rows, keyFn, nameFn){
  const g={}; rows.forEach(r=>{ const k=keyFn(r.t); (g[k] ||= {k, n:0, charged:0, net:0}); g[k].n++; g[k].charged+=r.charged; g[k].net+=r.net; });
  const list=Object.values(g).sort((a,b)=>b.net-a.net), max=Math.max(1,...list.map(x=>Math.abs(x.net)));

function render(){

  $('#root').innerHTML = (h + (UI.app!=='inicio' && !h.startsWith('<div class="intro"') ? demoBar() : '')).replace(/([ap]\. m)\.\./g,'$1.');
  document.title = {cliente:'ChambaYa', pro:'ChambaYa Pro', soporte:'ChambaYa · Consola de soporte', admin:'ChambaYa · Finanzas', inicio:'ChambaYa'}[UI.app];
  bindMap();
  const down=()=>document.querySelectorAll('[data-scroll]').forEach(el=>el.scrollTop=el.scrollHeight); down(); requestAnimationFrame(down); if(document.fonts) document.fonts.ready.then(down);
  save();
}

function merge3(b, l, r){
  if(same(l,b)) return clone(r); if(same(r,b) || same(l,r)) return clone(l);
  if(Array.isArray(l) && Array.isArray(r)){
    const lk=keyed(l), rk=keyed(r), B=new Map(keyed(Array.isArray(b)?b:[])), Lm=new Map(lk), Rm=new Map(rk);
    const out=[]; const add=k=>{ const bb=B.get(k), ll=Lm.get(k), rr=Rm.get(k);
      if(ll===undefined && rr!==undefined){ if(bb!==undefined && same(rr,bb)) return; out.push(clone(rr)); return; }
      if(rr===undefined && ll!==undefined){ if(bb!==undefined && same(ll,bb)) return; out.push(clone(ll)); return; }
      if(ll!==undefined) out.push(merge3(bb,ll,rr)); };
    const seen=new Set(); rk.forEach(([k])=>{ seen.add(k); add(k); }); lk.forEach(([k])=>{ if(!seen.has(k)) add(k); });
    return out;
  }
  if(l && r && typeof l==='object' && typeof r==='object' && !Array.isArray(l) && !Array.isArray(r)){
    const bo=(b&&typeof b==='object')?b:{}, out={};
    new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{ const bb=bo[k], ll=l[k], rr=r[k];
      if(!(k in l)){ if(k in bo && same(rr,bb)) return; out[k]=clone(rr); return; }
      if(!(k in r)){ if(k in bo && same(ll,bb)) return; out[k]=clone(ll); return; }
      out[k]=merge3(bb,ll,rr); });
    if(typeof l.seq==='number' && typeof r.seq==='number') out.seq=Math.max(l.seq,r.seq);
    return out;
  }
  return clone(l);
}
